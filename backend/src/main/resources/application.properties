spring.application.name=fleet_mgmt_sys
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleet_mgmt_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.org.springframework.boot.context.config=DEBUG

# LTA DataMall API
lta.datamall.base-url=https://datamall2.mytransport.sg/ltaodataservice
lta.datamall.api-key=${LTA_API_KEY:}

onemap.email=${ONEMAP_EMAIL:}
onemap.password=${ONEMAP_PASSWORD:}
onemap.api-key=${ONEMAP_API_KEY:}

# RestTemplate timeout (ms)
lta.datamall.connect-timeout=5000
lta.datamall.read-timeout=10000

# JDBC Batch inserts
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

lta.sync.enabled=false

task.priority.smallest=1
task.priority.largest=5