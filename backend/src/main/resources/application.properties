spring.application.name=fleet_mgmt_sys
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleet_mgmt_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:noclashfleet}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.org.springframework.boot.context.config=${CONFIG_LOG_LEVEL:DEBUG}

# LTA DataMall API
lta.datamall.base-url=https://datamall2.mytransport.sg/ltaodataservice
lta.datamall.api-key=${LTA_API_KEY:vONu3mIJRHGHsJqR7iJkpg==}

